<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mudfiles</title>
<meta name="description" content="Study tools, animations and other things we make.">
<meta property="og:title" content="mudfiles">
<meta property="og:description" content="Study tools, animations and other things we make.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="wordmark">mudfiles<span>.</span></h1>
    <p class="tagline">Study tools, animations and other things we make. Built for our own revision, shared in case they help yours.</p>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by subject"></nav>

  <main class="grid" id="grid"></main>

  <footer>
    <p>Made by students, for studying. Not official university material, so check anything important against your lecture notes.</p>
    <p>Follow along on Instagram: <a href="https://www.instagram.com/mudfiles/">@mudfiles</a></p>
  </footer>

</div>

<script src="posts.js"></script>
<script>
  // Builds the subject filter buttons and the post cards from the POSTS list in posts.js.
  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');

  // Only academic posts for now. Change to show music later.
  const visible = POSTS
    .filter(p => p.category === 'academic')
    .sort((a, b) => b.date.localeCompare(a.date));

  const subjects = ['All', ...new Set(visible.map(p => p.subject))];
  let current = 'All';

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function formatDate(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function renderFilters() {
    filters.innerHTML = '';
    if (subjects.length <= 2) return; // no point filtering with one subject
    subjects.forEach(s => {
      const b = el('button', 'chip', s);
      b.setAttribute('aria-pressed', s === current);
      b.onclick = () => { current = s; renderFilters(); renderGrid(); };
      filters.appendChild(b);
    });
  }

  function renderGrid() {
    grid.innerHTML = '';
    const list = visible.filter(p => current === 'All' || p.subject === current);
    if (!list.length) { grid.appendChild(el('p', 'empty', 'Nothing here yet.')); return; }

    list.forEach(p => {
      const card = el('a', 'card');
      card.href = p.path;

      if (p.thumb) {
        const img = el('img', 'thumb');
        img.src = p.thumb;
        img.alt = '';
        img.loading = 'lazy';
        card.appendChild(img);
      }

      const body = el('div', 'body');
      const tags = el('div', 'tags');
      tags.appendChild(el('span', 'tag', p.subject));
      if (p.course) tags.appendChild(el('span', 'tag plain', p.course));
      if (p.type) tags.appendChild(el('span', 'tag plain', p.type));
      body.appendChild(tags);

      body.appendChild(el('h2', '', p.title));
      if (p.lecture) body.appendChild(el('p', 'lecture', 'Lecture: ' + p.lecture));
      body.appendChild(el('p', 'desc', p.description));

      const meta = el('div', 'meta');
      meta.appendChild(el('span', '', 'by ' + p.author));
      meta.appendChild(el('span', '', formatDate(p.date)));
      body.appendChild(meta);

      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  renderFilters();
  renderGrid();
</script>
</body>
</html>
